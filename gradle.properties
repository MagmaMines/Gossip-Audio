# GossipAudio build settings
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# Test-only: Robolectric pulls androidx.test artifacts for the JVM UI tests.
# The shipped APK contains zero AndroidX classes (checked by tools/verify_apk.py).
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
