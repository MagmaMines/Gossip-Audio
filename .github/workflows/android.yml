name: Android CI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch pinned neural model and runtime
        run: tools/prepare_neural.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Unit tests (neural inference requires an Android device)
        run: gradle --no-daemon --stacktrace testDebugUnitTest --tests '*PipelineTest' --tests '*SpeechChunkTest'
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GossipAudio-neural-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: warn
      # User-requested build: publish only to the session branch so the APK can
      # be retrieved without relying on GitHub's artifact download host.
      - name: Publish requested APK to session branch
        if: success() && github.ref_name == 'arena/4b4d4c7a-gossip-audio'
        run: |
          set -euo pipefail
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          cp app/build/outputs/apk/debug/app-debug.apk dist/GossipAudio-1.1.0-neural-debug.apk
          sha256sum dist/GossipAudio-1.1.0-neural-debug.apk > dist/GossipAudio-1.1.0-neural-debug.sha256
          git add dist/GossipAudio-1.1.0-neural-debug.apk dist/GossipAudio-1.1.0-neural-debug.sha256
          git commit -m 'build: add neural debug APK' || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
