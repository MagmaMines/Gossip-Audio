name: Android CI

# GossipAudio — builds, tests and publishes the APK back into the repo so the
# artifact is reproducible and always in sync with the source tree.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/b73dc5e5-gossip-audio
      - main
    paths-ignore:
      - 'dist/**'
      - 'docs/shots/**'
      - '**.md'
      - 'assets/**'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace --console=plain testDebugUnitTest

      - name: Assemble debug + release + bundle
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug assembleRelease bundleRelease

      - name: Prepare dist
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GossipAudio-${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GossipAudio-${VERSION}-debug.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/GossipAudio-${VERSION}.aab"
          fi
          {
            echo "GossipAudio build report"
            echo "version: ${VERSION} (${VCODE})"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "gradle: $(gradle --version | grep Gradle | head -1)"
            echo ""
            echo "sha256:"
            sha256sum dist/*.apk dist/*.aab 2>/dev/null || true
            echo ""
            echo "apk size:"
            ls -l dist/
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: GossipAudio-apk
          path: dist/
          retention-days: 90

      - name: Publish APK into the repository
        run: |
          set -euo pipefail
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          git add -f dist
          if git diff --cached --quiet; then
            echo "No artifact changes to publish."
          else
            git commit -m "ci: publish APK + build report [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
