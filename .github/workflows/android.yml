name: Android CI

# GossipAudio — builds, tests and publishes the APK back into the repo so the
# artifact is reproducible and always in sync with the source tree.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/b73dc5e5-gossip-audio
      - main
    paths-ignore:
      - 'dist/**'
      - 'ci-logs/**'
      - 'docs/shots/**'
      - '**.md'
      - 'assets/**'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Inspect Android SDK
        run: |
          rm -f ci-logs/*.log
          set +e
          set +e
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -1 "${ANDROID_HOME}/platforms" 2>&1 | head
          ls -1 "${ANDROID_HOME}/build-tools" 2>&1 | head
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version
          gradle --version

      - name: Install missing SDK packages
        run: |
          set +e
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -20
          fi
          mkdir -p ci-logs
          echo "sdk ok" > ci-logs/sdk.txt
          ls -1 "$ANDROID_HOME/platforms" >> ci-logs/sdk.txt 2>&1
          ls -1 "$ANDROID_HOME/build-tools" >> ci-logs/sdk.txt 2>&1

      - name: Assemble debug + release + bundle
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace --console=plain --continue assembleDebug assembleRelease bundleRelease 2>&1 | tee ci-logs/assemble.log

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest 2>&1 | tee ci-logs/test.log

      - name: Prepare dist
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          mkdir -p dist
          mkdir -p dist/samples
          cp app/build/test-samples/*.wav dist/samples/ 2>/dev/null || true
          cp app/build/test-samples/*.mp3 dist/samples/ 2>/dev/null || true
          cp app/build/test-samples/pipeline-sample.txt dist/samples/ 2>/dev/null || true
          ls -l dist/samples || true
          cp app/build/outputs/apk/release/app-release.apk "dist/GossipAudio-${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GossipAudio-${VERSION}-debug.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/GossipAudio-${VERSION}.aab"
          fi
          {
            echo "GossipAudio build report"
            echo "version: ${VERSION} (${VCODE})"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "gradle: $(gradle --version | grep Gradle | head -1)"
            echo ""
            echo "sha256:"
            sha256sum dist/*.apk dist/*.aab 2>/dev/null || true
            echo ""
            echo "apk size:"
            ls -l dist/
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt

      - name: Upload artifacts (workflow run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GossipAudio-apk
          path: |
            dist/
            ci-logs/
          retention-days: 90
          if-no-files-found: warn

      - name: Publish APK into the repository
        if: success()
        run: |
          set -euo pipefail
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          git add -f dist
          if git diff --cached --quiet; then
            echo "No artifact changes to publish."
          else
            git commit -m "ci: publish APK + build report [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish failure diagnostics into the repository
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          mkdir -p ci-logs
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo "time: $(date -u)"
            echo "====== kotlin errors (test.log) ======"
            grep -E "^e: " ci-logs/test.log 2>/dev/null | sed -e 's|file:///home/runner/work/[^/]*/[^/]*/|src/|' | head -300 || true
            echo "====== kotlin errors (assemble.log) ======"
            grep -E "^e: " ci-logs/assemble.log 2>/dev/null | sed -e 's|file:///home/runner/work/[^/]*/[^/]*/|src/|' | head -300 || true
            echo "====== warnings that matter ======"
            grep -E "^e: |Unresolved|Type mismatch|none of the following|No value passed|cannot be applied|Overload resolution" ci-logs/test.log ci-logs/assemble.log 2>/dev/null | head -80 || true
            echo "====== what went wrong ======"
            grep -A 12 "What went wrong" ci-logs/test.log 2>/dev/null | head -60 || true
            grep -A 12 "What went wrong" ci-logs/assemble.log 2>/dev/null | head -60 || true
            echo "====== compiled files (last lines) ======"
            grep -E "^(w|e): " ci-logs/test.log 2>/dev/null | head -20 || true
            echo "====== test.log (tail) ======"
            tail -c 4000 ci-logs/test.log 2>/dev/null || true
            echo "====== assemble.log (tail) ======"
            tail -c 20000 ci-logs/assemble.log 2>/dev/null || true
            echo "====== sdk.txt ======"
            cat ci-logs/sdk.txt 2>/dev/null || true
          } > ci-logs/failure.txt
          rm -f ci-logs/*.log
          git add -f ci-logs/failure.txt ci-logs/sdk.txt 2>/dev/null || true
          git rm -r --cached --ignore-unmatch ci-logs > /dev/null 2>&1 || true
          git add -f ci-logs
          git commit -m "ci: failure diagnostics [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
