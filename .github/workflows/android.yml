name: Android CI
on:
  workflow_dispatch:
  push:
    branches:
      - arena/4b4d4c7a-gossip-audio
    paths-ignore:
      - 'dist/**'
      - 'ci-logs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch pinned neural model and runtime
        run: tools/prepare_neural.sh
      - name: Build debug APK
        run: set -o pipefail; gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
      # One-time user-requested signing key: only the certificate below is public.
      # The key/password are encrypted for retrieval by the session owner, not logged.
      - name: Build signed production APK (live ad unit)
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/signing-password.txt"
          export GA_STORE_FILE="$RUNNER_TEMP/gossipaudio-release.p12"
          export GA_STORE_PASSWORD="$(cat "$RUNNER_TEMP/signing-password.txt")"
          export GA_KEY_ALIAS="gossipaudio"
          export GA_KEY_PASSWORD="$GA_STORE_PASSWORD"
          keytool -genkeypair -noprompt -keystore "$GA_STORE_FILE" -storetype PKCS12 \
            -storepass "$GA_STORE_PASSWORD" -keypass "$GA_KEY_PASSWORD" -alias "$GA_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=GossipAudio, O=Beyoneer XYZ"
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GossipAudio-1.6.2-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/GossipAudio-1.6.2-release.apk" > "$RUNNER_TEMP/signature-check.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/GossipAudio-1.6.2-release.apk" | grep -F "package: name='xyz.beyoneer.gossipaudio'"
          unzip -p "$RUNNER_TEMP/GossipAudio-1.6.2-release.apk" 'classes*.dex' | strings | grep -F "ca-app-pub-8913512225928716/4570089297"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$RUNNER_TEMP/GossipAudio-1.6.2-release.apk" AndroidManifest.xml | grep -F "ca-app-pub-8913512225928716~8700905992"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/signing-material.tar" gossipaudio-release.p12 signing-password.txt signature-check.txt
          openssl cms -encrypt -aes256 -binary -in "$RUNNER_TEMP/signing-material.tar" \
            -out "$RUNNER_TEMP/signing-material.enc" -outform DER tools/ci/transfer-certificate.pem
          rm -f "$RUNNER_TEMP/signing-material.tar" "$RUNNER_TEMP/gossipaudio-release.p12" "$RUNNER_TEMP/signing-password.txt"
      - name: Unit tests (neural inference requires an Android device)
        run: set -o pipefail; gradle --no-daemon --stacktrace testDebugUnitTest --tests '*PipelineTest' --tests '*SpeechChunkTest' --tests '*AutoVoiceTest' 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Neural inference on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: tools/run_emulator_test.sh
      - name: Record emulator failure details
        if: failure() && github.ref_name == 'arena/4b4d4c7a-gossip-audio'
        run: |
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          mkdir -p ci-logs
          { tail -n 300 "$RUNNER_TEMP/build.log" 2>/dev/null || true; tail -n 200 "$RUNNER_TEMP/unit-test.log" 2>/dev/null || true; tail -n 200 "$RUNNER_TEMP/neural-test.log" 2>/dev/null || true; tail -n 200 "$RUNNER_TEMP/neural-logcat.log" 2>/dev/null || true; find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \; 2>/dev/null || true; } > ci-logs/neural-test-failure.txt
          git add ci-logs/neural-test-failure.txt
          git commit -m 'ci: capture neural test failure' && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GossipAudio-neural-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
            app/build/reports/androidTests/
          if-no-files-found: warn
      # The encrypted key transfer is readable only with the session owner's private key.
      - name: Publish requested APK to session branch
        if: success() && github.ref_name == 'arena/4b4d4c7a-gossip-audio'
        run: |
          set -euo pipefail
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          mkdir -p dist
          cp "$RUNNER_TEMP/GossipAudio-1.6.2-release.apk" dist/GossipAudio-1.6.2-release.apk
          sha256sum dist/GossipAudio-1.6.2-release.apk > dist/GossipAudio-1.6.2-release.sha256
          test "$(stat -c %s dist/GossipAudio-1.6.2-release.apk)" -le 104857600
          cp "$RUNNER_TEMP/signing-material.enc" dist/signing-material.enc
          git add dist/GossipAudio-1.6.2-release.apk dist/GossipAudio-1.6.2-release.sha256 dist/signing-material.enc
          git commit -m 'build: add signed AdMob release APK'
          git push origin "HEAD:${GITHUB_REF_NAME}"
