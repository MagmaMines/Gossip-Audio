name: Android CI
on:
  workflow_dispatch:
  push:
    branches:
      - arena/4b4d4c7a-gossip-audio
    paths-ignore:
      - 'dist/**'
      - 'ci-logs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch pinned neural model and runtime
        run: tools/prepare_neural.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Preserve ARM64 APK before emulator build
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/GossipAudio-1.4.0-neural-debug.apk"
      - name: Unit tests (neural inference requires an Android device)
        run: set -o pipefail; gradle --no-daemon --stacktrace testDebugUnitTest --tests '*PipelineTest' --tests '*SpeechChunkTest' 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Neural inference on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: tools/run_emulator_test.sh
      - name: Record emulator failure details
        if: failure() && github.ref_name == 'arena/4b4d4c7a-gossip-audio'
        run: |
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          mkdir -p ci-logs
          { tail -n 200 "$RUNNER_TEMP/unit-test.log" 2>/dev/null || true; tail -n 200 "$RUNNER_TEMP/neural-test.log" 2>/dev/null || true; tail -n 200 "$RUNNER_TEMP/neural-logcat.log" 2>/dev/null || true; find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \; 2>/dev/null || true; } > ci-logs/neural-test-failure.txt
          git add ci-logs/neural-test-failure.txt
          git commit -m 'ci: capture neural test failure' && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GossipAudio-neural-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/androidTests/
          if-no-files-found: warn
      # User-requested build: publish only to the session branch so the APK can
      # be retrieved without relying on GitHub's artifact download host.
      - name: Publish requested APK to session branch
        if: success() && github.ref_name == 'arena/4b4d4c7a-gossip-audio'
        run: |
          set -euo pipefail
          git config user.name "GossipAudio CI"
          git config user.email "ci@beyoneer.xyz"
          mkdir -p dist
          cp "$RUNNER_TEMP/GossipAudio-1.4.0-neural-debug.apk" dist/GossipAudio-1.4.0-neural-debug.apk
          cp "$RUNNER_TEMP/neural-sample.wav" dist/GossipAudio-1.4.0-neural-sample.wav
          sha256sum dist/GossipAudio-1.4.0-neural-debug.apk > dist/GossipAudio-1.4.0-neural-debug.sha256
          git rm -f --ignore-unmatch dist/GossipAudio-1.1.0-neural-debug.apk dist/GossipAudio-1.1.0-neural-debug.sha256 dist/GossipAudio-1.2.0-neural-debug.apk dist/GossipAudio-1.2.0-neural-debug.sha256 dist/GossipAudio-1.2.0-neural-sample.wav dist/GossipAudio-1.3.0-neural-debug.apk dist/GossipAudio-1.3.0-neural-debug.sha256 dist/GossipAudio-1.3.0-neural-sample.wav
          git add dist/GossipAudio-1.4.0-neural-debug.apk dist/GossipAudio-1.4.0-neural-debug.sha256 dist/GossipAudio-1.4.0-neural-sample.wav
          git commit -m 'build: add neural debug APK' || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
